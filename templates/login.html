<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ParkFlow Login</title><link rel="stylesheet" href="/static/style.css"></head><body class="login"><div class="loginbox"><div class="brand">PARK<span>FLOW</span></div><div class="eyebrow">SMART PARKING MANAGEMENT</div><div class="card"><div class="icon">P</div><h1>Welcome back</h1><p>Sign in to manage your parking lot.</p>{% with messages=get_flashed_messages() %}{% if messages %}<div class="error">{{messages[0]}}</div>{% endif %}{% endwith %}<form method="post"><label>USERNAME</label><input name="username" placeholder="admin" required><label>PASSWORD</label><input name="password" type="password" placeholder="••••••••" required><button>ENTER DASHBOARD</button></form><small>Local assignment demo · No internet required</small></div></div></body></html>
